name: Day 73 - Application Deploy OIDC Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployment-role:
    name: Verify environment-trusted application role

    if: github.ref == 'refs/heads/main'

    environment: dev
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify assumed AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          assumed_arn="$(
            aws sts get-caller-identity \
              --query Arn \
              --output text
          )"

          echo "Assumed ARN: ${assumed_arn}"

          [[ "${assumed_arn}" == *":assumed-role/github-app-deploy-role/"* ]]